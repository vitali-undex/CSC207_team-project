# Two checks on every pull request into dev or main, and every push to dev:
# - "Build and test": compiles the project and runs the unit tests on Java 11.
# - "Checkstyle": runs the team's Checkstyle rules. It fails (red) when there are violations,
#   so a pull request with style problems doesn't look like it passed. Each violation shows up
#   as an annotation on the code and in the run's summary.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

# A newer push to the same pull request or branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Java 11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # Headless: the Swing view tests build components but never open a window.
      # Checkstyle runs in its own job below.
      - name: Build and run the tests
        run: mvn -B verify -Djava.awt.headless=true -Dcheckstyle.skip=true

  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Run Checkstyle
        run: mvn -B checkstyle:check

      - name: Report violations
        run: python3 .github/scripts/checkstyle_report.py target/checkstyle-result.xml
